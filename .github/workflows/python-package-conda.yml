name: Python Package using Conda

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + test (conda, Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash -el {0}  # login shell, so the conda environment below is active in every step
    env:
      ARES_PROVIDER: rule-based  # the test suite never calls a real LLM provider
    steps:
      - uses: actions/checkout@v4

      - name: Set up conda environment (environment.yml)
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: ares-accord
          auto-activate-base: false
          conda-remove-defaults: "true"

      - name: Install pinned Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint (ruff; rules in ruff.toml)
        run: ruff check .

      - name: Test (pytest + coverage)
        run: pytest -q --cov=ares --cov-report=term
